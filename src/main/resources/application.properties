spring.application.name=saferoute-ai
server.port=${PORT:8080}

# Optional local secrets file (see .env.example). Lines look like: MAIL_USERNAME=me@gmail.com
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Database: H2 file database in ./data by default (survives restarts, nothing to install).
# For MySQL set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD / _DRIVER_CLASS_NAME.
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/saferoute;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.data-locations=classpath:sql/data.sql
spring.h2.console.enabled=${H2_CONSOLE:false}

# ---------------------------------------------------------------------------
# Sessions: HTTP-only cookie, not sent on cross-site requests, kept for 7 days of inactivity.
# ---------------------------------------------------------------------------
server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=SAFEROUTE_SESSION
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/javascript
spring.web.resources.cache.cachecontrol.no-cache=true
spring.mvc.async.request-timeout=-1

# ---------------------------------------------------------------------------
# Public address used in links sent to contacts (tracking pages).
# For contacts on other phones, expose the app (e.g. `cloudflared tunnel --url http://localhost:8080`)
# and set PUBLIC_BASE_URL to the https address it prints.
# ---------------------------------------------------------------------------
saferoute.public-base-url=${PUBLIC_BASE_URL:http://localhost:${server.port}}
# Or let the app open a free Cloudflare quick tunnel by itself (needs cloudflared installed:
# winget install Cloudflare.cloudflared). The https address it gets is used in every tracking link.
saferoute.tunnel.enabled=${PUBLIC_TUNNEL:false}
saferoute.tunnel.cloudflared-path=${CLOUDFLARED_PATH:}
# Trust X-Forwarded-* headers from the local tunnel so https is detected correctly.
server.forward-headers-strategy=native

# ---------------------------------------------------------------------------
# Alerts. Push (ntfy) works out of the box. Email and SMS switch on when configured.
# ---------------------------------------------------------------------------
saferoute.alerts.push-enabled=${PUSH_ENABLED:true}
saferoute.alerts.ntfy-url=${NTFY_URL:https://ntfy.sh}
saferoute.alerts.mail-from=${MAIL_FROM:}
saferoute.alerts.twilio-account-sid=${TWILIO_ACCOUNT_SID:}
saferoute.alerts.twilio-auth-token=${TWILIO_AUTH_TOKEN:}
saferoute.alerts.twilio-from-number=${TWILIO_FROM_NUMBER:}

# Email over SMTP (Gmail: turn on 2-Step Verification and create an App Password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# ---------------------------------------------------------------------------
# Synthetic example risk zones in central Bengaluru (for classroom demos of the "flagged zone" feature).
# Off by default so made-up data never affects real route scores.
saferoute.demo-zones=${DEMO_ZONES:false}

# ---------------------------------------------------------------------------
# Other SafeRoute settings (see SafeRouteProperties.java for every option and its default)
# ---------------------------------------------------------------------------
saferoute.http.user-agent=SafeRouteAI/1.0 (educational project)
saferoute.map.city=Bengaluru
saferoute.map.default-latitude=12.9716
saferoute.map.default-longitude=77.5946
saferoute.contacts.default-country-code=+91
saferoute.contacts.max-per-user=5
saferoute.ml.model-dir=./data/ml
