<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6d28d9">
    <script>try{var t=localStorage.getItem("saferoute.theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;}catch(e){}</script>
    <meta name="robots" content="noindex">
    <title>Live location · SafeRoute AI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d28d9'/%3E%3Cstop offset='1' stop-color='%23e11d74'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M20 3l14 5.5v10c0 8.6-6 15.6-14 18.5C12 34.1 6 27.1 6 18.5v-10z' fill='url(%23g)'/%3E%3Cpath d='M20 28s-7.2-5-7.2-10.4a4.2 4.2 0 017.2-3 4.2 4.2 0 017.2 3C27.2 23 20 28 20 28z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .track-card { position: absolute; left: 16px; top: 16px; z-index: 20; width: min(400px, calc(100vw - 32px)); }
        .track-hero { border-radius: 24px; padding: 1.1rem 1.2rem; color: #fff; background: linear-gradient(135deg, #2b1d47, #46246e); box-shadow: var(--shadow-3); animation: rise .5s var(--ease); }
        .track-hero.sos, .track-hero.alerted { background: linear-gradient(135deg, #b5242a, #e5383b); animation: rise .5s var(--ease), throb-card 1.6s ease-in-out infinite; }
        .track-hero.safe { background: linear-gradient(135deg, #0b7a4f, #12a26a); }
        .track-hero.check { background: linear-gradient(135deg, #b46300, #e08a00); }
        @keyframes throb-card { 50% { box-shadow: 0 0 0 10px rgba(229, 56, 59, .25), var(--shadow-3); } }
        .track-hero h1 { font-family: var(--font-display); font-size: 1.6rem; margin: .2rem 0; }
        .track-body { margin-top: .7rem; }
        .track-body .card { padding: 1rem; }
        .track-body .btn-ghost { background: var(--surface); box-shadow: var(--shadow-1); }
        @media (max-width: 760px) { .track-card { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; } }
    </style>
</head>
<body>
<div id="app">
    <div id="mapStage" aria-label="Map"></div>
    <section class="track-card" id="card" aria-live="polite">
        <div class="track-hero"><div class="skeleton" style="height:70px;opacity:.3"></div></div>
    </section>
</div>
<div class="toasts" id="toasts"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="/js/track.js"></script>
</body>
</html>
