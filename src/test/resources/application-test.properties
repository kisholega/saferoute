# Tests use a throwaway in-memory database and never touch the real ./data folder.
spring.datasource.url=jdbc:h2:mem:saferoute-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.config.import=
saferoute.ml.model-dir=target/test-ml
saferoute.ml.evaluate-on-startup=false
saferoute.ml.cv-folds=3
# Background jobs are triggered directly by the tests.
saferoute.scheduling.enabled=false
# Alerts are delivered on the calling thread so tests can check the result immediately.
saferoute.alerts.synchronous=true
spring.mail.username=
saferoute.alerts.twilio-account-sid=
# Outside services are mocked; these unreachable URLs make any accidental real call fail fast.
saferoute.geocoding.nominatim-url=http://localhost:1
saferoute.geocoding.photon-url=http://localhost:1
saferoute.routing.walk-url=http://localhost:1
saferoute.routing.drive-url=http://localhost:1
saferoute.routing.drive-fallback-url=http://localhost:1
saferoute.overpass.urls=http://localhost:1
saferoute.alerts.ntfy-url=http://localhost:1
saferoute.overpass.city-snapshot=classpath:geo/none-in-tests.json.gz
saferoute.demo-zones=true
